name: Build Game APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Unzip Project
      run: unzip -o game.zip

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: |
        # البحث عن ملف gradlew في أي مجلد فرعي وإعطائه صلاحية التنفيذ
        find . -name "gradlew" -exec chmod +x {} \;

    - name: Generate Debug Keystore
      run: |
        # البحث عن المجلد الذي يحتوي على ملف build.gradle.kts والانتقال إليه
        PROJECT_DIR=$(find . -name "build.gradle.kts" -maxdepth 2 -exec dirname {} \; | head -n 1)
        cd "$PROJECT_DIR"
        keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"

    - name: Build with Gradle
      run: |
        # البحث عن ملف gradlew وتشغيله من داخل مجلده
        find . -name "gradlew" -execdir ./gradlew assembleDebug \;

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: game-debug
        # البحث عن أي ملف APK في أي مكان
        path: '**/*.apk'
